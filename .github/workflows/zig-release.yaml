name: zig-release

on:
  workflow_call:
    inputs:
      zig-version:
        type: string
        required: true
      package-name:
        type: string
        required: true
      package-subdir:
        type: string
        required: false
        default: ""
      buildArgs:
        type: string
        required: false
        default: "-Dtarget=x86_64-linux -Doptimize=ReleaseFast package"
      # Only used to name the output archive; the build target itself comes from buildArgs
      target:
        type: string
        required: false
        default: "x86_64-linux"
      checkout-zigkm:
        type: boolean
        required: false
        default: false

# Hack for mach macos build
env:
  AGREE: true

jobs:
  zig-release:
    runs-on: [self-hosted, release]
    timeout-minutes: 10

    # The repo is checked out to main/ so zigkm can sit next to it at ../zigkm
    defaults:
      run:
        working-directory: main

    env:
      ZIG_VERSION: ${{inputs.zig-version}}
      PACKAGE_NAME: ${{inputs.package-name}}
      PACKAGE_SUBDIR: ${{inputs.package-subdir}}
      BUILD_ARGS: ${{inputs.buildArgs}}
      TARGET: ${{inputs.target}}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: main
          submodules: 'recursive'

      - name: zigkm
        if: inputs.checkout-zigkm
        uses: actions/checkout@v7
        with:
          repository: 'kapricorn-media/zigkm'
          path: zigkm

      - name: build
        # BUILD_ARGS is intentionally unquoted so it splits into separate arguments
        run: zig "$ZIG_VERSION" build $BUILD_ARGS

      - name: rename
        run: mv "zig-out/$PACKAGE_SUBDIR" "$PACKAGE_NAME"

      - name: zip
        run: tar -czf output_archive.tar.gz "$PACKAGE_NAME"

      - name: copy
        run: mkdir -p ~/ci/builds/"$PACKAGE_NAME" && cp output_archive.tar.gz ~/ci/builds/"$PACKAGE_NAME"/"${PACKAGE_NAME}_${TARGET}.$(date '+%s').tar.gz"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{inputs.package-name}}_${{inputs.target}}.tar.gz
          path: main/output_archive.tar.gz
